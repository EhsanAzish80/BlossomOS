monitor=,800x600@60,auto,1
animations {
    enabled = false
}
misc {
    disable_hyprland_logo = true
}
debug {
    disable_logs = false
    enable_stdout_logs = true
}
exec-once = quickshell -p /usr/share/blossom-os/shell/quickshell.qml
exec-once = env QML_IMPORT_PATH=/usr/lib/qt6/qml QT_LINUX_ACCESSIBILITY_ALWAYS_ON=1 QT_LOGGING_RULES=qt.accessibility.*=true /usr/lib/blossom-os/blossom-shell-ui
