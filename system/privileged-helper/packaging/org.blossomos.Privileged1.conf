<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.blossomos.Privileged1"/>
  </policy>
  <policy context="default">
    <deny send_destination="org.blossomos.Privileged1"/>
    <allow send_destination="org.blossomos.Privileged1"
           send_path="/org/blossomos/Privileged1"
           send_interface="org.blossomos.Privileged1"
           send_member="TryRestartBluetooth1"/>
  </policy>
</busconfig>
