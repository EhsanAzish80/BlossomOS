[Unit]
After=systemd-user-sessions.service

[Service]
ExecStartPre=-/usr/bin/useradd --create-home --groups audio,input,video --shell /bin/bash blossom
ExecStartPre=/usr/bin/chown -R blossom:blossom /home/blossom
ExecStartPre=/usr/bin/chmod 0700 /home/blossom /home/blossom/.config /home/blossom/.config/hypr
ExecStart=
ExecStart=-/usr/bin/agetty --autologin blossom --noclear %I $TERM
