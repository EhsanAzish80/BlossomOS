[package]
name = "blossom-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# This checkout lives inside a managed worktree under the parent repository.
# Keep the fuzz crate standalone so Cargo never binds it to that outer workspace.
[workspace]

[dependencies]
blossom-core = { path = "../core/blossom-core" }
libfuzzer-sys = "0.4"

[[bin]]
name = "untrusted_protocols"
path = "fuzz_targets/untrusted_protocols.rs"
test = false
doc = false
bench = false
