[workspace]
members = [
    "core/blossom-core",
    "apps/blossom-cli",
    "system/model-gateway",
    "system/privileged-helper",
    "system/shell-service",
]
resolver = "3"
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
ctrlc = "3.5.2"
libc = "0.2.189"
nix = { version = "0.31.3", features = ["fs", "process", "socket", "user"] }
chacha20poly1305 = "0.11.0"
getrandom = "0.3.4"
zeroize = "1.9.0"
