name: Phase 11 physical preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase11-physical-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Read-only MacBookPro11,1 preflight
    runs-on: [self-hosted, linux, x64, blossom-gpu]
    timeout-minutes: 10
    steps:
      - name: Restore runner ownership before checkout
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            archlinux@sha256:694da1fce635e3a14d90751941b08f02c500e8724682f7a00768e7152251ec34 \
            chown -R "$(id -u):$(id -g)" /workspace

      - name: Check out reviewed repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run minimized read-only preflight
        run: |
          result="$RUNNER_TEMP/phase11-physical-preflight.json"
          python3 scripts/distribution/physical_preflight.py --observe-host | tee "$result"
          python3 -c 'import json,sys; value=json.load(open(sys.argv[1])); assert value["result"] == "eligible_for_qualification"; assert value["authority"] == "read_only_preflight_only"' "$result"

      - name: Upload minimized result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase11-physical-preflight
          path: ${{ runner.temp }}/phase11-physical-preflight.json
          if-no-files-found: error
          retention-days: 7
