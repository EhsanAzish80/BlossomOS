name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap dbus-daemon shellcheck

      - name: Enable unprivileged user namespaces for Bubblewrap integration test
        run: sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run repository checks
        run: python3 scripts/ci/check_repository.py

      - name: Validate privileged helper packaging boundary
        run: |
          python3 scripts/ci/check_privileged_packaging.py
          sudo install -d -m 0755 /usr/lib/blossom-os
          sudo install -m 0755 /bin/true /usr/lib/blossom-os/blossom-privileged-helper
          systemd-analyze verify system/privileged-helper/packaging/blossom-privileged-helper.service

      - name: Validate inactive model runtime packaging boundary
        run: |
          python3 scripts/ci/check_model_runtime_packaging.py
          python3 scripts/package_llama_cpp_runtime.py --verify-lock
          sudo install -d -m 0755 \
            /usr/lib/blossom-os/providers/ollama \
            /usr/lib/blossom-os/providers/llama-cpp \
            /usr/lib/blossom-os/models/ollama \
            /usr/lib/blossom-os/models/llama-cpp
          sudo install -m 0755 /bin/true /usr/lib/blossom-os/blossom-model-gateway
          sudo install -m 0755 /bin/true /usr/lib/blossom-os/providers/ollama/ollama
          sudo install -m 0755 /bin/true /usr/lib/blossom-os/providers/llama-cpp/llama-server
          sudo install -m 0644 /dev/null /usr/lib/blossom-os/models/ollama/evidence-model
          sudo install -m 0644 /dev/null /usr/lib/blossom-os/models/llama-cpp/evidence.gguf
          fixture_units=/tmp/blossom-model-runtime-units
          install -d -m 0755 "$fixture_units"
          install -m 0644 \
            system/model-runtime/packaging/blossom-model-netns.service \
            system/model-runtime/packaging/blossom-model-gateway.service \
            "$fixture_units"
          cargo run --quiet --package blossom-core \
            --example render_synthetic_provider_units -- "$fixture_units"
          systemd-analyze verify \
            "$fixture_units"/blossom-model-netns.service \
            "$fixture_units"/blossom-model-gateway.service \
            "$fixture_units"/blossom-model-ollama.service \
            "$fixture_units"/blossom-model-llama-cpp.service

      - name: Run prototype smoke tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Lint shell scripts
        run: |
          git ls-files -z '*.sh' scripts/blossom |
            xargs -0 --no-run-if-empty shellcheck --severity=error

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: cargo test --all-targets

      - name: Verify release gateway remains fail closed
        run: |
          cargo build --release --package blossom-model-gateway
          set +e
          target/release/blossom-model-gateway
          default_status=$?
          target/release/blossom-model-gateway --synthetic-fixture
          fixture_status=$?
          set -e
          test "$default_status" -eq 78
          test "$fixture_status" -eq 64
