name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap shellcheck

      - name: Enable unprivileged user namespaces for Bubblewrap integration test
        run: sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run repository checks
        run: python3 scripts/ci/check_repository.py

      - name: Run prototype smoke tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Lint shell scripts
        run: |
          git ls-files -z '*.sh' scripts/blossom |
            xargs -0 --no-run-if-empty shellcheck --severity=error

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: cargo test --all-targets
