name: Phase 4 installed evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase4-installed-evidence
  cancel-in-progress: false

jobs:
  llama-cpp-x86-64:
    name: Installed llama.cpp boundary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the disposable supported runner
        run: |
          test "$RUNNER_OS" = Linux
          test "$(uname -m)" = x86_64
          test -n "$RUNNER_TEMP"
          systemctl --version

      - name: Build the gated gateway and evidence probe
        run: |
          cargo build --locked --release --package blossom-model-gateway \
            --features production-private-inference
          cargo build --locked --release --package blossom-model-gateway \
            --example installed_gateway_probe

      - name: Fetch immutable package inputs
        env:
          LOCK: system/model-runtime/registry/llama-cpp-cpu-x86_64.lock.json
        run: |
          mkdir -m 0700 "$RUNNER_TEMP/blossom-inputs"
          runtime_url=$(jq -r .runtime.url "$LOCK")
          model_url=$(jq -r .model.url "$LOCK")
          license_url=$(jq -r .model.license.url "$LOCK")
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/blossom-inputs/runtime.tar.gz" "$runtime_url"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/blossom-inputs/model.gguf" "$model_url"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/blossom-inputs/model.LICENSE" "$license_url"

      - name: Assemble the closed package tree
        run: |
          python3 scripts/package_llama_cpp_runtime.py \
            --runtime-archive "$RUNNER_TEMP/blossom-inputs/runtime.tar.gz" \
            --model "$RUNNER_TEMP/blossom-inputs/model.gguf" \
            --model-license "$RUNNER_TEMP/blossom-inputs/model.LICENSE" \
            --gateway-binary "$GITHUB_WORKSPACE/target/release/blossom-model-gateway" \
            --output "$RUNNER_TEMP/blossom-package-root"

      - name: Install into the disposable runner
        run: |
          sudo systemctl stop blossom-model-gateway.service \
            blossom-model-llama-cpp.service blossom-model-netns.service || true
          sudo cp -a --no-preserve=ownership \
            "$RUNNER_TEMP/blossom-package-root/usr/." /usr/
          sudo cp -a --no-preserve=ownership \
            "$RUNNER_TEMP/blossom-package-root/etc/." /etc/
          sudo systemd-sysusers \
            /usr/lib/sysusers.d/blossom-model-runtime.conf
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin \
            blossom-evidence-allowed
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin \
            blossom-evidence-unlisted
          sudo usermod --append --groups blossom-ai blossom-evidence-allowed
          sudo install -o root -g root -m 0644 /dev/null \
            /home/blossom-phase4-private
          sudo install -d -o root -g root -m 0755 /opt/blossom-phase4-private
          sudo install -o root -g root -m 0644 /dev/null \
            /opt/blossom-phase4-private/host-only
          sudo systemctl daemon-reload

      - name: Start the installed distinct-identity services
        run: |
          sudo systemctl start blossom-model-netns.service
          sudo systemctl start blossom-model-llama-cpp.service
          provider_pid=$(systemctl show --property MainPID --value \
            blossom-model-llama-cpp.service)
          for attempt in $(seq 1 120); do
            if sudo nsenter --target "$provider_pid" --net \
              curl --silent --fail --max-time 1 \
              http://127.0.0.1:8080/health >/dev/null; then
              break
            fi
            sleep 1
          done
          sudo nsenter --target "$provider_pid" --net \
            curl --silent --fail --max-time 1 \
            http://127.0.0.1:8080/health >/dev/null
          sudo systemctl start blossom-model-gateway.service || true
          systemctl is-active --quiet blossom-model-netns.service
          systemctl is-active --quiet blossom-model-llama-cpp.service
          systemctl is-active --quiet blossom-model-gateway.service
          for attempt in $(seq 1 60); do
            test -S /run/blossom-model-gateway/inference.sock && break
            sleep 1
          done
          test -S /run/blossom-model-gateway/inference.sock

      - name: Verify identities socket namespaces and limits
        run: |
          gateway_uid=$(id -u blossom-model-gateway)
          provider_uid=$(id -u blossom-model-provider)
          test "$gateway_uid" -ne 0
          test "$provider_uid" -ne 0
          test "$gateway_uid" -ne "$provider_uid"
          test "$(stat -c %U /run/blossom-model-gateway/inference.sock)" = \
            blossom-model-gateway
          test "$(stat -c %G /run/blossom-model-gateway/inference.sock)" = blossom-ai
          test "$(stat -c %a /run/blossom-model-gateway/inference.sock)" = 660
          gateway_pid=$(systemctl show --property MainPID --value blossom-model-gateway.service)
          provider_pid=$(systemctl show --property MainPID --value blossom-model-llama-cpp.service)
          test "$(sudo stat -Lc %i /proc/$gateway_pid/ns/net)" = \
            "$(sudo stat -Lc %i /proc/$provider_pid/ns/net)"
          test "$(sudo stat -Lc %i /proc/1/ns/net)" != \
            "$(sudo stat -Lc %i /proc/$provider_pid/ns/net)"
          test "$(systemctl show --property TasksMax --value blossom-model-gateway.service)" = 32
          test "$(systemctl show --property MemoryMax --value blossom-model-gateway.service)" = 268435456
          test "$(systemctl show --property TasksMax --value blossom-model-llama-cpp.service)" = 64
          sudo nsenter --target "$provider_pid" --net \
            sh -c '! curl --fail --max-time 3 https://example.com/'

      - name: Verify installed filesystem denials
        run: |
          gateway_pid=$(systemctl show --property MainPID --value \
            blossom-model-gateway.service)
          provider_pid=$(systemctl show --property MainPID --value \
            blossom-model-llama-cpp.service)
          gateway_uid=$(id -u blossom-model-gateway)
          gateway_gid=$(id -g blossom-model-gateway)
          provider_uid=$(id -u blossom-model-provider)
          provider_gid=$(id -g blossom-model-provider)
          for path in /home/blossom-phase4-private \
            /opt/blossom-phase4-private/host-only /etc/shadow /proc/1/cmdline; do
            sudo nsenter --target "$gateway_pid" --mount \
              --setgid "$gateway_gid" --setuid "$gateway_uid" \
              /usr/bin/test ! -e "$path"
          done
          for path in /home/blossom-phase4-private \
            /opt/blossom-phase4-private/host-only /etc/passwd /proc/1/cmdline \
            /usr/lib/blossom-os/blossom-model-gateway; do
            sudo nsenter --target "$provider_pid" --mount \
              --setgid "$provider_gid" --setuid "$provider_uid" \
              /usr/bin/test ! -e "$path"
          done
          sudo nsenter --target "$gateway_pid" --mount \
            findmnt -n -o OPTIONS -T /usr/lib/blossom-os/blossom-model-gateway \
            | grep -Eq '(^|,)ro(,|$)'
          sudo nsenter --target "$provider_pid" --mount \
            findmnt -n -o OPTIONS -T \
              /usr/lib/blossom-os/models/llama-cpp/qwen2.5-0.5b-instruct-q4_k_m.gguf \
            | grep -Eq '(^|,)ro(,|$)'

      - name: Verify admission and real offline inference
        run: |
          target/release/examples/installed_gateway_probe expect-rejected
          sudo -u blossom-evidence-unlisted \
            target/release/examples/installed_gateway_probe expect-rejected
          sudo -u blossom-model-provider \
            target/release/examples/installed_gateway_probe expect-rejected
          sudo -u blossom-evidence-allowed \
            target/release/examples/installed_gateway_probe infer

      - name: Verify request-bound streaming cancellation
        run: |
          sudo -u blossom-evidence-allowed \
            target/release/examples/installed_gateway_probe cancel

      - name: Verify audit isolation and redaction
        run: |
          audit=/run/blossom-model-gateway/audit/audit.jsonl
          sudo test -f "$audit"
          test "$(sudo stat -c %U "$audit")" = blossom-model-gateway
          test "$(sudo stat -c %a "$audit")" = 600
          sudo -u blossom-evidence-allowed test ! -r "$audit"
          sudo -u blossom-model-provider test ! -r "$audit"
          sudo grep -Eq '"kind":"request_terminal"' "$audit"
          sudo grep -Eq '"outcome":"completed_text"' "$audit"
          sudo grep -Eq '"outcome":"cancelled"' "$audit"
          if sudo grep -Eq \
            'Reply with one short greeting|Write the numbers from one to one hundred|blossom-evidence|blossom-ai|reasoning_text|tool_arguments|/home/' \
            "$audit"; then
            exit 1
          fi

      - name: Verify provider loss is non-success
        run: |
          sudo systemctl stop blossom-model-llama-cpp.service
          if sudo -u blossom-evidence-allowed \
            target/release/examples/installed_gateway_probe infer; then
            exit 1
          fi
          sudo grep -Eq '"outcome":"provider_failed"' \
            /run/blossom-model-gateway/audit/audit.jsonl

      - name: Verify orderly cleanup and stale socket refusal
        run: |
          socket=/run/blossom-model-gateway/inference.sock
          drop_in=/run/systemd/system/blossom-model-gateway.service.d
          wrapper=/run/blossom-model-gateway-stale-wrapper
          sudo systemctl stop blossom-model-gateway.service
          test ! -e "$socket"
          printf '%s\n' \
            '#!/bin/sh' \
            'set -eu' \
            'install -m 0660 /dev/null /run/blossom-model-gateway/inference.sock' \
            'exec /usr/lib/blossom-os/blossom-model-gateway' \
            | sudo tee "$wrapper" >/dev/null
          sudo chown root:root "$wrapper"
          sudo chmod 0755 "$wrapper"
          sudo install -d -o root -g root -m 0755 "$drop_in"
          printf '%s\n' \
            '[Service]' \
            'ExecStart=' \
            'ExecStart=/bin/sh /run/blossom-model-gateway-stale-wrapper' \
            | sudo tee "$drop_in/stale-socket.conf" >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl start blossom-model-gateway.service
          for attempt in $(seq 1 50); do
            systemctl is-failed --quiet blossom-model-gateway.service && break
            sleep 0.1
          done
          systemctl is-failed --quiet blossom-model-gateway.service
          test "$(systemctl show --property Result --value \
            blossom-model-gateway.service)" = exit-code
          test "$(systemctl show --property ExecMainStatus --value \
            blossom-model-gateway.service)" -ne 0
          test ! -S "$socket"

      - name: Capture content-free failure diagnostics
        if: failure()
        run: |
          for unit in blossom-model-netns.service \
            blossom-model-llama-cpp.service blossom-model-gateway.service; do
            systemctl show "$unit" \
              --property ActiveState,SubState,Result,ExecMainStatus || true
          done
          # The namespace anchor never handles prompts, completions, provider
          # responses, or caller metadata. Its journal is therefore safe to
          # expose when diagnosing pre-inference sandbox setup failures.
          sudo journalctl --unit blossom-model-netns.service \
            --boot --no-pager --output short-monotonic || true
          # Identify the first incompatible namespace/hardening directive on
          # this disposable host without starting either inference process.
          properties=(
            "User=blossom-model-gateway"
            "Group=blossom-model-gateway"
            "PrivateNetwork=yes"
            "PrivateTmp=yes"
            "PrivateDevices=yes"
            "ProtectSystem=strict"
            "ProtectHome=yes"
            "InaccessiblePaths=/boot /etc /home /media /mnt /opt /root /run /srv /var"
            "ProtectKernelTunables=yes"
            "ProtectKernelModules=yes"
            "ProtectKernelLogs=yes"
            "ProtectControlGroups=yes"
            "ProtectClock=yes"
            "ProtectHostname=yes"
            "ProtectProc=invisible"
            "ProcSubset=pid"
          )
          property_args=()
          probe_index=0
          for property in "${properties[@]}"; do
            property_args+=(--property "$property")
            probe_index=$((probe_index + 1))
            if sudo systemd-run --wait --collect --quiet \
              --unit "blossom-netns-probe-$probe_index" \
              "${property_args[@]}" /usr/bin/true; then
              echo "namespace-probe-pass=$property"
            else
              echo "namespace-probe-fail=$property"
              break
            fi
          done
