name: Phase 6 installed shell evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase6-installed-shell-evidence
  cancel-in-progress: false

jobs:
  arch-x86-64:
    name: Installed Arch Hyprland Quickshell boundary
    runs-on: [self-hosted, linux, x64, blossom-gpu]
    container:
      image: archlinux@sha256:694da1fce635e3a14d90751941b08f02c500e8724682f7a00768e7152251ec34
      options: >-
        --device /dev/dri
        --volume /run/user/1000/wayland-0:/run/user/1000/blossom-parent
    timeout-minutes: 30
    steps:
      - name: Establish target Arch userspace
        run: |
          grep -qx 'ID=arch' /etc/os-release
          test "$(uname -m)" = x86_64
          pacman -Syu --noconfirm \
          base-devel bubblewrap cmake dbus-broker hyprland jq mesa ninja niri \
          python python-atspi qt6-base qt6-declarative quickshell rust \
          wayland-utils

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the evidence-only parent compositor version
        run: |
          lock=system/shell/evidence/parent-compositors-arch-x86_64.lock.json
          expected=$(jq -r '.packages[] | select(.name == "niri") | .version' "$lock")
          actual=$(pacman -Q niri | cut -d ' ' -f 2)
          test -n "$expected"
          test "$actual" = "$expected"

      - name: Require the reviewed package versions
        run: |
          lock=system/shell/registry/arch-x86_64.lock.json
          for package in hyprland quickshell systemd dbus-broker; do
            expected=$(jq -r --arg package "$package" \
              '.packages[] | select(.name == $package) | .version' "$lock")
            actual=$(pacman -Q "$package" | cut -d ' ' -f 2)
            test -n "$expected"
            test "$actual" = "$expected"
          done

      - name: Build the gated service and narrow QML plugin
        run: |
          useradd --create-home --shell /usr/bin/nologin blossom-ci
          chown -R blossom-ci:blossom-ci "$GITHUB_WORKSPACE"
          runuser -u blossom-ci -- env HOME=/home/blossom-ci \
            cargo build --locked --release --package blossom-shell-service \
            --features production-dbus-service
          install -d -o blossom-ci -g blossom-ci -m 0755 \
            "$RUNNER_TEMP/blossom-shell-client-build"
          runuser -u blossom-ci -- env HOME=/home/blossom-ci \
            cmake -S system/shell/client-plugin \
            -B "$RUNNER_TEMP/blossom-shell-client-build" -G Ninja \
            -DBLOSSOM_BUILD_CLIENT_BUS_TEST=ON
          runuser -u blossom-ci -- env HOME=/home/blossom-ci \
            cmake --build "$RUNNER_TEMP/blossom-shell-client-build"
          test -f "$RUNNER_TEMP/blossom-shell-client-build/qml/Blossom/Shell/qmldir"
          test -f "$RUNNER_TEMP/blossom-shell-client-build/qml/Blossom/Shell/libblossom-shell-client-plugin.so"
          test -f "$RUNNER_TEMP/blossom-shell-client-build/qml/Blossom/Shell/libblossom-shell-client-pluginplugin.so"
          find "$RUNNER_TEMP/blossom-shell-client-build/qml/Blossom/Shell" \
            -maxdepth 1 -type f -name '*.so' | grep -q .

      - name: Exercise the real Qt client wire types against the Rust service
        run: |
          runuser -u blossom-ci -- env HOME=/home/blossom-ci \
            dbus-run-session -- bash system/shell/tests/run-client-bus.sh \
            "$GITHUB_WORKSPACE/target/release/blossom-shell-service" \
            "$RUNNER_TEMP/blossom-shell-client-build/blossom-client-bus-test"

      - name: Install the closed shell package tree
        run: |
          install -D -o root -g root -m 0755 \
            target/release/blossom-shell-service \
            /usr/lib/blossom-os/blossom-shell-service
          install -D -o root -g root -m 0644 \
            system/shell/packaging/blossom-shell-service.service \
            /usr/lib/systemd/user/blossom-shell-service.service
          install -D -o root -g root -m 0644 \
            system/shell/packaging/org.blossomos.Shell1.service \
            /usr/share/dbus-1/services/org.blossomos.Shell1.service
          install -d -o root -g root -m 0755 \
            /usr/lib/qt6/qml/Blossom/Shell /usr/share/blossom-os/shell
          cp -a "$RUNNER_TEMP/blossom-shell-client-build/qml/Blossom/Shell/." \
            /usr/lib/qt6/qml/Blossom/Shell/
          cp -a system/shell/qml/. /usr/share/blossom-os/shell/
          chown -R root:root /usr/lib/qt6/qml/Blossom /usr/share/blossom-os
          find /usr/lib/qt6/qml/Blossom /usr/share/blossom-os -type d -exec chmod 0755 {} +
          find /usr/lib/qt6/qml/Blossom /usr/share/blossom-os -type f -exec chmod 0644 {} +
          chmod 0755 /usr/lib/qt6/qml/Blossom/Shell/*.so
          install -d -o blossom-ci -g blossom-ci -m 0700 /run/user/1000
          test "$(id -u blossom-ci)" = 1000
          runuser -u blossom-ci -- env XDG_RUNTIME_DIR=/run/user/1000 \
            systemd-analyze --user verify \
            /usr/lib/systemd/user/blossom-shell-service.service
          ! ldd /usr/lib/blossom-os/blossom-shell-service | grep -q 'not found'
          ! ldd /usr/lib/qt6/qml/Blossom/Shell/*.so | grep -q 'not found'
          for library in /usr/lib/qt6/qml/Blossom/Shell/*.so; do
            readelf -d "$library" | grep -F 'Library runpath: [$ORIGIN]'
          done

      - name: Load the installed surface in nested Hyprland
        run: |
          for device in /dev/dri/card* /dev/dri/renderD*; do
            test -e "$device" || continue
            device_gid=$(stat -c '%g' "$device")
            device_group=$(getent group "$device_gid" | cut -d: -f1)
            if test -z "$device_group"; then
              device_group="blossom-dri-$device_gid"
              groupadd --gid "$device_gid" "$device_group"
            fi
            usermod --append --groups "$device_group" blossom-ci
          done
          runuser -u blossom-ci -- test -r /dev/dri/card1
          runuser -u blossom-ci -- test -w /dev/dri/card1
          runuser -u blossom-ci -- test -r /dev/dri/renderD128
          runuser -u blossom-ci -- test -w /dev/dri/renderD128
          test -S /run/user/1000/blossom-parent
          install -o blossom-ci -g blossom-ci -m 0644 \
            system/shell/evidence/hyprland-nested.conf "$RUNNER_TEMP/hyprland.conf"
          runuser -u blossom-ci -- env \
            HOME=/home/blossom-ci \
            XDG_RUNTIME_DIR=/run/user/1000 \
            dbus-run-session -- bash -eo pipefail -c '
              niri_pid=""
              hyprland_pid=""
              probe_pid=""
              cleanup() {
                status=$?
                if test -n "$probe_pid"; then
                  kill "$probe_pid" 2>/dev/null || true
                fi
                if test -n "$hyprland_pid"; then
                  kill "$hyprland_pid" 2>/dev/null || true
                fi
                if test -n "$niri_pid"; then
                  kill "$niri_pid" 2>/dev/null || true
                fi
                if test "$status" -ne 0; then
                  echo "::group::Host Wayland globals"
                  cat "$XDG_RUNTIME_DIR/host-wayland.log" 2>/dev/null || true
                  echo "::endgroup::"
                  echo "::group::Niri log"
                  cat "$XDG_RUNTIME_DIR/niri.log" 2>/dev/null || true
                  echo "::endgroup::"
                  echo "::group::Nested parent Wayland globals"
                  cat "$XDG_RUNTIME_DIR/nested-wayland.log" 2>/dev/null || true
                  echo "::endgroup::"
                  echo "::group::Hyprland launcher log"
                  cat "$XDG_RUNTIME_DIR/hyprland.log" 2>/dev/null || true
                  echo "::endgroup::"
                  echo "::group::Hyprland runtime logs"
                  find "$XDG_RUNTIME_DIR/hypr" -type f -maxdepth 3 \
                    -exec sh -c '"'"'echo "--- $1"; cat "$1"'"'"' sh {} \; \
                    2>/dev/null || true
                  echo "::endgroup::"
                fi
                exit "$status"
              }
              trap cleanup EXIT
              # Qt only joins AT-SPI during process startup.  Warm the
              # session accessibility bus before Hyprland launches
              # Quickshell so the installed shell is present in the tree.
              python3 -c "import pyatspi; pyatspi.Registry.getDesktop(0)"
              busctl --user --quiet status org.a11y.Bus >/dev/null
              WAYLAND_DISPLAY=blossom-parent wayland-info \
                >"$XDG_RUNTIME_DIR/host-wayland.log" 2>&1
              grep -A3 "interface: '\''wl_compositor'\''" \
                "$XDG_RUNTIME_DIR/host-wayland.log" | \
                grep -Eq "version:[[:space:]]+([6-9]|[1-9][0-9]+)"
              grep -A3 "interface: '\''xdg_wm_base'\''" \
                "$XDG_RUNTIME_DIR/host-wayland.log" | \
                grep -Eq "version:[[:space:]]+([6-9]|[1-9][0-9]+)"
              WAYLAND_DISPLAY=blossom-parent niri \
                >"$XDG_RUNTIME_DIR/niri.log" 2>&1 &
              niri_pid=$!
              nested_socket=""
              for attempt in $(seq 1 200); do
                nested_socket=$(sed -n \
                  "s/.*listening on Wayland socket: \([^[:space:]]*\).*/\1/p" \
                  "$XDG_RUNTIME_DIR/niri.log" | tail -n 1)
                if test -n "$nested_socket" && \
                   test -S "$XDG_RUNTIME_DIR/$nested_socket"; then break; fi
                kill -0 "$niri_pid"
                sleep 0.1
              done
              test -n "$nested_socket"
              test -S "$XDG_RUNTIME_DIR/$nested_socket"
              WAYLAND_DISPLAY="$nested_socket" wayland-info \
                >"$XDG_RUNTIME_DIR/nested-wayland.log" 2>&1
              for interface in wl_compositor xdg_wm_base; do
                grep -A3 "interface: '\''$interface'\''" \
                  "$XDG_RUNTIME_DIR/nested-wayland.log" | \
                  grep -Eq "version:[[:space:]]+([6-9]|[1-9][0-9]+)"
              done
              grep -A3 "interface: '\''wl_seat'\''" \
                "$XDG_RUNTIME_DIR/nested-wayland.log" | \
                grep -Eq "version:[[:space:]]+([9]|[1-9][0-9]+)"
              grep -q "interface: '\''zwp_linux_dmabuf_v1'\''" \
                "$XDG_RUNTIME_DIR/nested-wayland.log"
              WAYLAND_DISPLAY="$nested_socket" \
                Hyprland --config "'$RUNNER_TEMP'/hyprland.conf" \
                >"$XDG_RUNTIME_DIR/hyprland.log" 2>&1 &
              hyprland_pid=$!
              for attempt in $(seq 1 200); do
                if pgrep -u "$(id -u)" -x quickshell >/dev/null; then break; fi
                kill -0 "$hyprland_pid"
                sleep 0.1
              done
              pgrep -u "$(id -u)" -x quickshell >/dev/null
              for attempt in $(seq 1 100); do
                busctl --user --quiet status org.blossomos.Shell1 >/dev/null 2>&1 && break
                sleep 0.1
              done
              busctl --user --quiet status org.blossomos.Shell1 >/dev/null
              qml_runner=$(command -v qml6 || command -v qml)
              WAYLAND_DISPLAY="$nested_socket" \
                QT_LINUX_ACCESSIBILITY_ALWAYS_ON=1 \
                "$qml_runner" system/shell/tests/accessibility_probe.qml \
                >"$XDG_RUNTIME_DIR/accessibility-probe.log" 2>&1 &
              probe_pid=$!
              python3 system/shell/tests/check_accessibility_probe.py
              kill "$probe_pid"
              wait "$probe_pid" 2>/dev/null || true
              probe_pid=""
              ! grep -E "module .* is not installed|Type .* unavailable|failed to create root component" \
                "$XDG_RUNTIME_DIR"/quickshell/by-id/*/log.qslog
              python3 system/shell/tests/check_accessibility.py
            '

      - name: State evidence limits
        run: |
          echo 'Evidence uses real Hyprland and Quickshell in Arch userspace, nested through a pinned compatibility parent in the trusted runner desktop.'
          echo 'It does not claim broad GPU, hardware, input, installer, ArchISO, or release proof.'
