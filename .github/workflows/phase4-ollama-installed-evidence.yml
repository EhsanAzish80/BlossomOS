name: Phase 4 Ollama installed evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase4-ollama-installed-evidence
  cancel-in-progress: false

jobs:
  ollama-x86-64:
    name: Installed Ollama boundary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the disposable supported runner
        run: |
          test "$RUNNER_OS" = Linux
          test "$(uname -m)" = x86_64
          test -n "$RUNNER_TEMP"
          systemctl --version
          tar --help | grep -q zstd

      - name: Build the gated gateway and evidence probes
        run: |
          cargo build --locked --release --package blossom-model-gateway \
            --features production-private-inference
          cargo build --locked --release --package blossom-model-gateway \
            --example installed_gateway_probe
          cargo build --locked --release --package blossom-model-gateway \
            --example installed_llama_race_provider

      - name: Fetch immutable package inputs
        env:
          LOCK: system/model-runtime/registry/ollama-cpu-x86_64.lock.json
        run: |
          mkdir -m 0700 "$RUNNER_TEMP/blossom-inputs"
          mkdir -m 0700 "$RUNNER_TEMP/blossom-inputs/blobs"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/blossom-inputs/runtime.tar.zst" \
            "$(jq -r .runtime.url "$LOCK")"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/blossom-inputs/runtime.LICENSE" \
            "$(jq -r .runtime.license.url "$LOCK")"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/blossom-inputs/manifest.json" \
            "$(jq -r .model.manifest.url "$LOCK")"
          jq -r '.model.blobs[] | [.sha256, .url] | @tsv' "$LOCK" | while IFS=$'\t' read -r digest url; do
            curl --fail --location --proto '=https' --tlsv1.2 \
              --output "$RUNNER_TEMP/blossom-inputs/blobs/$digest" \
              "$url"
          done

      - name: Assemble the closed package tree
        run: |
          python3 scripts/package_ollama_runtime.py \
            --runtime-archive "$RUNNER_TEMP/blossom-inputs/runtime.tar.zst" \
            --runtime-license "$RUNNER_TEMP/blossom-inputs/runtime.LICENSE" \
            --manifest "$RUNNER_TEMP/blossom-inputs/manifest.json" \
            --blob-directory "$RUNNER_TEMP/blossom-inputs/blobs" \
            --gateway-binary "$GITHUB_WORKSPACE/target/release/blossom-model-gateway" \
            --output "$RUNNER_TEMP/blossom-package-root"
          python3 scripts/package_ollama_runtime.py \
            --runtime-archive "$RUNNER_TEMP/blossom-inputs/runtime.tar.zst" \
            --runtime-license "$RUNNER_TEMP/blossom-inputs/runtime.LICENSE" \
            --manifest "$RUNNER_TEMP/blossom-inputs/manifest.json" \
            --blob-directory "$RUNNER_TEMP/blossom-inputs/blobs" \
            --gateway-binary "$GITHUB_WORKSPACE/target/release/blossom-model-gateway" \
            --output "$RUNNER_TEMP/blossom-package-root-second"
          diff --recursive --brief "$RUNNER_TEMP/blossom-package-root" \
            "$RUNNER_TEMP/blossom-package-root-second"
          test ! -e "$RUNNER_TEMP/blossom-package-root/usr/lib/systemd/system/blossom-model-llama-cpp.service"
          test ! -e "$RUNNER_TEMP/blossom-package-root/usr/lib/blossom-os/providers/ollama/libggml-cuda.so"
          test ! -d "$RUNNER_TEMP/blossom-package-root/usr/lib/blossom-os/providers/ollama/cuda_v12"
          test ! -d "$RUNNER_TEMP/blossom-package-root/usr/lib/blossom-os/providers/ollama/vulkan"
          touch "$RUNNER_TEMP/blossom-inputs/blobs/unlisted"
          if python3 scripts/package_ollama_runtime.py \
            --runtime-archive "$RUNNER_TEMP/blossom-inputs/runtime.tar.zst" \
            --runtime-license "$RUNNER_TEMP/blossom-inputs/runtime.LICENSE" \
            --manifest "$RUNNER_TEMP/blossom-inputs/manifest.json" \
            --blob-directory "$RUNNER_TEMP/blossom-inputs/blobs" \
            --gateway-binary "$GITHUB_WORKSPACE/target/release/blossom-model-gateway" \
            --output "$RUNNER_TEMP/should-not-exist"; then
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/should-not-exist"
          rm "$RUNNER_TEMP/blossom-inputs/blobs/unlisted"

      - name: Install into the disposable runner
        run: |
          sudo cp -a --no-preserve=ownership "$RUNNER_TEMP/blossom-package-root/usr/." /usr/
          sudo cp -a --no-preserve=ownership "$RUNNER_TEMP/blossom-package-root/etc/." /etc/
          sudo systemd-sysusers /usr/lib/sysusers.d/blossom-model-runtime.conf
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin blossom-evidence-allowed
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin blossom-evidence-unlisted
          sudo usermod --append --groups blossom-ai blossom-evidence-allowed
          sudo install -o root -g root -m 0644 /dev/null /home/blossom-phase4-private
          sudo install -d -o root -g root -m 0755 /opt/blossom-phase4-private
          sudo install -o root -g root -m 0644 /dev/null /opt/blossom-phase4-private/host-only
          sudo install -D -o root -g root -m 0755 \
            target/release/examples/installed_llama_race_provider \
            /usr/local/libexec/blossom-installed-provider-race
          sudo systemctl daemon-reload

      - name: Start the installed distinct-identity services
        run: |
          sudo systemctl start blossom-model-netns.service
          sudo systemctl start blossom-model-ollama.service
          provider_pid=$(systemctl show --property MainPID --value blossom-model-ollama.service)
          for attempt in $(seq 1 180); do
            if sudo nsenter --target "$provider_pid" --net \
              curl --silent --fail --max-time 1 http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 1
          done
          sudo nsenter --target "$provider_pid" --net \
            curl --silent --fail --max-time 1 http://127.0.0.1:11434/api/tags >/dev/null
          sudo systemctl start blossom-model-gateway.service
          systemctl is-active --quiet blossom-model-netns.service
          systemctl is-active --quiet blossom-model-ollama.service
          systemctl is-active --quiet blossom-model-gateway.service
          for attempt in $(seq 1 60); do
            test -S /run/blossom-model-gateway/inference.sock && break
            sleep 1
          done
          test -S /run/blossom-model-gateway/inference.sock

      - name: Verify identities namespaces limits and offline boundary
        run: |
          gateway_uid=$(id -u blossom-model-gateway)
          provider_uid=$(id -u blossom-model-provider)
          test "$gateway_uid" -ne 0
          test "$provider_uid" -ne 0
          test "$gateway_uid" -ne "$provider_uid"
          test "$(stat -c %U /run/blossom-model-gateway/inference.sock)" = blossom-model-gateway
          test "$(stat -c %G /run/blossom-model-gateway/inference.sock)" = blossom-ai
          test "$(stat -c %a /run/blossom-model-gateway/inference.sock)" = 660
          gateway_pid=$(systemctl show --property MainPID --value blossom-model-gateway.service)
          provider_pid=$(systemctl show --property MainPID --value blossom-model-ollama.service)
          test "$(sudo stat -Lc %i /proc/$gateway_pid/ns/net)" = "$(sudo stat -Lc %i /proc/$provider_pid/ns/net)"
          test "$(sudo stat -Lc %i /proc/1/ns/net)" != "$(sudo stat -Lc %i /proc/$provider_pid/ns/net)"
          test "$(systemctl show --property TasksMax --value blossom-model-ollama.service)" = 64
          test "$(systemctl show --property MemoryMax --value blossom-model-ollama.service)" = 4294967296
          sudo nsenter --target "$provider_pid" --net sh -c '! curl --fail --max-time 3 https://example.com/'

      - name: Verify installed filesystem denials
        run: |
          gateway_pid=$(systemctl show --property MainPID --value blossom-model-gateway.service)
          provider_pid=$(systemctl show --property MainPID --value blossom-model-ollama.service)
          gateway_uid=$(id -u blossom-model-gateway)
          gateway_gid=$(id -g blossom-model-gateway)
          provider_uid=$(id -u blossom-model-provider)
          provider_gid=$(id -g blossom-model-provider)
          for path in /home/blossom-phase4-private /opt/blossom-phase4-private/host-only /etc/shadow /proc/1/cmdline; do
            sudo nsenter --target "$gateway_pid" --mount --setgid "$gateway_gid" --setuid "$gateway_uid" /usr/bin/test ! -e "$path"
          done
          for path in /home/blossom-phase4-private /opt/blossom-phase4-private/host-only /etc/passwd /proc/1/cmdline /usr/lib/blossom-os/blossom-model-gateway; do
            sudo nsenter --target "$provider_pid" --mount --setgid "$provider_gid" --setuid "$provider_uid" /usr/bin/test ! -e "$path"
          done
          sudo nsenter --target "$provider_pid" --mount \
            findmnt -n -o OPTIONS -T /usr/lib/blossom-os/models/ollama | grep -Eq '(^|,)ro(,|$)'

      - name: Verify admission real inference and cancellation
        run: |
          target/release/examples/installed_gateway_probe expect-rejected
          sudo -u blossom-evidence-unlisted target/release/examples/installed_gateway_probe expect-rejected
          sudo -u blossom-model-provider target/release/examples/installed_gateway_probe expect-rejected
          sudo -u blossom-evidence-allowed target/release/examples/installed_gateway_probe infer ollama
          sudo -u blossom-evidence-allowed target/release/examples/installed_gateway_probe cancel ollama

      - name: Verify provider races and terminal-write containment
        run: |
          gateway_pid=$(systemctl show --property MainPID --value blossom-model-gateway.service)
          provider_uid=$(id -u blossom-model-provider)
          provider_gid=$(id -g blossom-model-provider)
          fixture=/usr/local/libexec/blossom-installed-provider-race
          sudo systemctl stop blossom-model-ollama.service
          for mode in headers completion terminal-write; do
            sudo nsenter --target "$gateway_pid" --net --setgid "$provider_gid" --setuid "$provider_uid" \
              "$fixture" "$mode" ollama &
            fixture_pid=$!
            for attempt in $(seq 1 50); do
              if sudo nsenter --target "$gateway_pid" --net ss -ltn 'sport = :11434' | grep -q 11434; then break; fi
              sleep 0.1
            done
            if test "$mode" = headers; then probe=cancel-delayed; elif test "$mode" = completion; then probe=cancel-after-delta; else probe=refuse-terminal-write; fi
            sudo -u blossom-evidence-allowed target/release/examples/installed_gateway_probe "$probe" ollama
            wait "$fixture_pid"
            systemctl is-active --quiet blossom-model-gateway.service
          done

      - name: Verify audit redaction and provider loss
        run: |
          audit=/run/blossom-model-gateway/audit/audit.jsonl
          sudo test -s "$audit"
          sudo grep -q '"outcome":"completed_text"' "$audit"
          sudo grep -q '"outcome":"cancelled"' "$audit"
          sudo grep -q '"outcome":"failed_unavailable"' "$audit" || true
          ! sudo grep -F 'Reply with one short greeting.' "$audit"
          ! sudo grep -F 'Write the numbers' "$audit"
          sudo -u blossom-evidence-allowed target/release/examples/installed_gateway_probe infer ollama || true
          systemctl is-active --quiet blossom-model-gateway.service
          sudo grep -q '"outcome":"failed_unavailable"' "$audit"

      - name: Verify orderly cleanup and stale socket refusal
        run: |
          sudo systemctl stop blossom-model-gateway.service
          test ! -e /run/blossom-model-gateway/inference.sock
          sudo install -m 0600 /dev/null /run/blossom-model-gateway/inference.sock
          if sudo systemctl start blossom-model-gateway.service; then exit 1; fi
          systemctl is-failed --quiet blossom-model-gateway.service
          sudo test -f /run/blossom-model-gateway/inference.sock

      - name: Capture content-free failure diagnostics
        if: failure()
        run: |
          sudo systemctl status blossom-model-netns.service blossom-model-ollama.service blossom-model-gateway.service --no-pager || true
          sudo journalctl -u blossom-model-gateway.service --no-pager | sed -E 's/(prompt|content|response)=[^ ]+/<redacted>/g' || true
