name: Phase 7 installed battery evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase7-installed-battery-evidence
  cancel-in-progress: false

jobs:
  battery-present:
    name: Real battery-present UPower boundary
    runs-on: [self-hosted, linux, x64, blossom-gpu]
    container:
      image: archlinux@sha256:694da1fce635e3a14d90751941b08f02c500e8724682f7a00768e7152251ec34
      options: >-
        --volume /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    timeout-minutes: 20
    steps:
      - name: Establish target Arch userspace
        run: |
          grep -qx 'ID=arch' /etc/os-release
          test "$(uname -m)" = x86_64
          pacman -Syu --noconfirm base-devel rust

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prove real battery-present UPower observation
        run: |
          test -S /run/dbus/system_bus_socket
          cargo run --locked --release --package blossom-core \
            --example installed_battery_probe -- expect-present

  no-battery:
    name: Real no-battery UPower boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Establish battery-free UPower host
        run: |
          test "$RUNNER_OS" = Linux
          test "$(uname -m)" = x86_64
          sudo apt-get update
          sudo apt-get install --yes upower
          sudo systemctl start upower.service
          systemctl is-active --quiet upower.service
          test ! -e /sys/class/power_supply/BAT0
          test ! -e /sys/class/power_supply/BAT1

      - name: Prove real no-battery UPower observation
        run: |
          cargo run --locked --release --package blossom-core \
            --example installed_battery_probe -- expect-absent

  evidence-complete:
    name: Battery evidence complete
    needs: [battery-present, no-battery]
    runs-on: ubuntu-latest
    steps:
      - name: Require both physical outcomes
        run: echo 'Real UPower present and absent observations passed.'
